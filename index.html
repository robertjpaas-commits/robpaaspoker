<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RobPaasPoker</title>
  <meta name="description" content="Rob Paas — professional tournament poker player. Streams, strategy breakdowns, and the Road to 100K challenge.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <div class="page">

    <header class="site-header">
      <div class="brand-name">Rob<span>Paas</span>Poker</div>
      <div class="brand-rule"></div>
      <nav class="social-row" aria-label="Social media">
        <a class="social-icon instagram" href="https://www.instagram.com/robpaaspoker/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/instagram/FFFFFF" alt="Instagram" loading="lazy"></a>
        <a class="social-icon x" href="https://x.com/RobPaasPoker" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/x/FFFFFF" alt="X" loading="lazy"></a>
        <a class="social-icon youtube" href="https://www.youtube.com/@robertpaaspoker" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/youtube/FFFFFF" alt="YouTube" loading="lazy"></a>
        <a class="social-icon facebook" href="https://www.facebook.com/RobertPaasPoker/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/facebook/FFFFFF" alt="Facebook" loading="lazy"></a>
        <a class="social-icon tiktok" href="https://www.tiktok.com/@robertpaas" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt="TikTok" loading="lazy"></a>
        <a class="social-icon twitch" href="https://www.twitch.tv/robpaaspoker" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/twitch/FFFFFF" alt="Twitch" loading="lazy"></a>
        <a class="social-icon kick" href="https://kick.com/robpaaspoker" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/kick/000000" alt="Kick" loading="lazy"></a>
        <a class="social-icon discord" href="https://discord.gg/Pz7nrhqhHF" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/discord/FFFFFF" alt="Discord" loading="lazy"></a>
      </nav>
    </header>

    <section>
      <a class="card cta-card" href="about/">
        <div class="cta-title">About Me</div>
        <div class="cta-sub">Who I am, my story, and how I ended up playing poker for a living &rarr;</div>
      </a>
    </section>

    <section>
      <a class="card cta-card" href="Roadto$100k/">
        <div class="cta-title">Road to $100K</div>
        <div class="cta-sub">Follow the 2026 challenge &mdash; daily profit, a full calendar, and progress toward $100,000 &rarr;</div>
        <div class="mini-meter">
          <div class="mini-meter-fill" id="mini-meter-fill" style="width: 0%"></div>
        </div>
        <div class="mini-meter-caption"><span id="mini-meter-amount" class="mini-meter-amount">&nbsp;</span><span id="mini-meter-rest"></span></div>
      </a>
    </section>

    <section>
      <div class="twitch-schedule">
        <a class="twitch-wordmark" href="https://www.twitch.tv/robpaaspoker" target="_blank" rel="noopener">
          <img src="https://cdn.simpleicons.org/twitch/9146FF" alt="" loading="lazy">
          <span>Twitch</span>
        </a>
        <span class="schedule-text">Live Thursday&ndash;Monday &middot; 4PM&ndash;1AM</span>
      </div>
      <div class="card video-wrap shorts-wrap">
        <!-- Cycles through featured TikToks via TikTok's official Embed Player (player/v1).
             To update the lineup, edit the TIKTOK_IDS array in the script near the bottom
             of this file. Auto-advance relies on TikTok's onStateChange postMessage event.
             The built-in volume button in this player is known to be unreliable inside
             embeds, so a custom mute/unmute button is layered on top that sends TikTok's
             documented mute/unMute postMessage commands directly. -->
        <iframe
          id="tiktok-player"
          src="https://www.tiktok.com/player/v1/7669088022519893255?autoplay=1&muted=1&loop=0&controls=1&progress_bar=1&play_button=1&volume_control=1&fullscreen_button=1"
          title="Featured TikToks"
          allow="autoplay; encrypted-media; fullscreen"
          allowfullscreen>
        </iframe>
        <button id="tiktok-mute-toggle" class="video-mute-toggle" type="button" aria-label="Unmute video">🔇</button>
      </div>
    </section>

  </div>

  <script>
    fetch('Roadto$100k/data/2026.json', { cache: 'no-store' })
      .then((r) => r.json())
      .then((d) => {
        const total = d.days.reduce((sum, day) => sum + day.total, 0);
        const pct = Math.max(0, Math.min(100, (total / d.goal) * 100));
        const sign = total < 0 ? '-' : '+';
        const amount = Math.abs(total).toLocaleString('en-US', { maximumFractionDigits: 0 });
        document.getElementById('mini-meter-fill').style.width = pct.toFixed(1) + '%';
        const amountEl = document.getElementById('mini-meter-amount');
        amountEl.textContent = `${sign}$${amount}`;
        amountEl.className = 'mini-meter-amount ' + (total >= 0 ? 'positive' : 'negative');
        document.getElementById('mini-meter-rest').textContent = ` · ${pct.toFixed(1)}% to $100K`;
      })
      .catch(() => {});
  </script>

  <script>
    // Auto-advances the featured TikTok box through TIKTOK_IDS in order, looping back to the
    // start. Relies on TikTok's official player postMessage API (see player/v1 docs) to detect
    // when the current video ends.
    (function () {
      const TIKTOK_IDS = [
        '7669088022519893255',
        '7670238637857967367',
        '7669505968060894482',
        '7670567029383908615',
        '7671297756622785799',
      ];
      let current = 0;
      let muted = true;
      const player = document.getElementById('tiktok-player');
      const muteBtn = document.getElementById('tiktok-mute-toggle');

      function loadVideo(id) {
        player.src = `https://www.tiktok.com/player/v1/${id}?autoplay=1&muted=1&loop=0&controls=1&progress_bar=1&play_button=1&volume_control=1&fullscreen_button=1`;
        // Each fresh load starts muted again (required for autoplay to be allowed), so reset
        // the button to match rather than silently drifting out of sync with actual state.
        muted = true;
        muteBtn.textContent = '🔇';
        muteBtn.setAttribute('aria-label', 'Unmute video');
      }

      // TikTok's own in-player volume button is unreliable inside embeds, so this sends the
      // documented mute/unMute postMessage commands directly instead of depending on it.
      muteBtn.addEventListener('click', () => {
        muted = !muted;
        player.contentWindow.postMessage(
          { type: muted ? 'mute' : 'unMute', 'x-tiktok-player': true },
          'https://www.tiktok.com'
        );
        muteBtn.textContent = muted ? '🔇' : '🔊';
        muteBtn.setAttribute('aria-label', muted ? 'Unmute video' : 'Mute video');
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== 'https://www.tiktok.com') return;
        const data = event.data;
        if (!data || !data['x-tiktok-player']) return;
        if (data.type === 'onStateChange' && data.value === 0) {
          current = (current + 1) % TIKTOK_IDS.length;
          loadVideo(TIKTOK_IDS[current]);
        }
      });
    })();
  </script>
</body>
</html>
