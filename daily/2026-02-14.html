    <div class="lb-caption" id="lb-caption"></div>
    <button type="button" class="lb-next" id="lb-next" aria-label="Next">&rsaquo;</button>
  </div>

  <script>
    // Photo lightbox. No library: the whole thing is one overlay element reused for
    // every shot, driven by the data- attributes already on each thumbnail button.
    (function () {
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".shot-btn"));
      if (!buttons.length) return;
      var box = document.getElementById("lightbox");
      var img = document.getElementById("lb-img");
      var cap = document.getElementById("lb-caption");
      var at = 0;

      function show(i) {
        at = (i + buttons.length) % buttons.length;
        var btn = buttons[at];
        img.src = btn.dataset.src;
        img.alt = btn.dataset.caption || "";
        cap.textContent = btn.dataset.caption || "";
        cap.hidden = !btn.dataset.caption;
        box.hidden = false;
        document.body.classList.add("lb-open");
      }

      function close() {
        box.hidden = true;
        img.src = "";
        document.body.classList.remove("lb-open");
      }

      buttons.forEach(function (btn, i) {
        btn.addEventListener("click", function () { show(i); });
      });
      document.getElementById("lb-close").addEventListener("click", close);
      document.getElementById("lb-prev").addEventListener("click", function (ev) {
        ev.stopPropagation();
        show(at - 1);
      });
      document.getElementById("lb-next").addEventListener("click", function (ev) {
        ev.stopPropagation();
        show(at + 1);
      });
      // Clicking the backdrop closes; clicking the image itself must not.
      box.addEventListener("click", function (ev) { if (ev.target === box) close(); });
      document.addEventListener("keydown", function (ev) {
        if (box.hidden) return;
        if (ev.key === "Escape") close();
        else if (ev.key === "ArrowLeft") show(at - 1);
        else if (ev.key === "ArrowRight") show(at + 1);
      });
    })();
  </script>
