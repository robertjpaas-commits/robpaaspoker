<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RobPaasPoker</title>
  <meta name="description" content="Tracking a $100,000 poker profit goal for 2026, day by day.">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=24">
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="brand-name" href="../">Rob<span>Paas</span>Poker</a>
      <div class="brand-rule"></div>
      <nav class="social-row" aria-label="Social media">
        <a class="social-icon instagram" href="https://www.instagram.com/robpaaspoker/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/instagram/FFFFFF" alt="Instagram" loading="lazy"></a>
        <a class="social-icon x" href="https://x.com/RobPaasPoker" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/x/FFFFFF" alt="X" loading="lazy"></a>
        <a class="social-icon youtube" href="https://www.youtube.com/@robpaaspoker" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/youtube/FFFFFF" alt="YouTube" loading="lazy"></a>
        <a class="social-icon facebook" href="https://www.facebook.com/RobertPaasPoker/" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/facebook/FFFFFF" alt="Facebook" loading="lazy"></a>
        <a class="social-icon tiktok" href="https://www.tiktok.com/@robertpaas" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt="TikTok" loading="lazy"></a>
        <a class="social-icon twitch" href="https://www.twitch.tv/robpaaspoker" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/twitch/FFFFFF" alt="Twitch" loading="lazy"></a>
        <a class="social-icon kick" href="https://kick.com/robpaaspoker" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/kick/000000" alt="Kick" loading="lazy"></a>
        <a class="social-icon discord" href="https://discord.gg/Pz7nrhqhHF" target="_blank" rel="noopener"><img src="https://cdn.simpleicons.org/discord/FFFFFF" alt="Discord" loading="lazy"></a>
      </nav>
    </header>

    <section class="card hero">
      <div class="hero-value-row">
        <div class="hero-figure" id="hero-total">$0</div>
      </div>

      <div class="chart-wrap">
        <canvas id="profit-chart"></canvas>
      </div>

      <!-- Labels carry ids because they reword when a single site is selected: there
           are no per-site hours, so "days played" becomes "days active" and so on. -->
      <div class="stat-row">
        <div class="stat">
          <div class="stat-label" id="label-days">Days played</div>
          <div class="stat-value" id="stat-days">&mdash;</div>
        </div>
        <div class="stat">
          <div class="stat-label" id="label-avg">Avg / day played</div>
          <div class="stat-value" id="stat-avg">&mdash;</div>
        </div>
        <div class="stat">
          <div class="stat-label">Best day</div>
          <div class="stat-value" id="stat-best">&mdash;</div>
        </div>
        <div class="stat" id="stat-hourly-tile">
          <div class="stat-label" id="label-hourly">Hourly rate</div>
          <div class="stat-value" id="stat-hourly">&mdash;</div>
        </div>
        <div class="stat" id="stat-hours-tile">
          <div class="stat-label" id="label-hours">Total hours</div>
          <div class="stat-value" id="stat-hours">&mdash;</div>
        </div>
      </div>
    </section>

    <!-- Chart mode sits directly above the site filter: the two rows together are
         the controls for everything on the page. -->
    <div class="graph-toggle" id="graph-toggle">
      <button class="pill active" data-mode="cumulative">Cumulative</button>
      <button class="pill" data-mode="daily">Daily</button>
      <button class="pill" data-mode="monthly">Monthly</button>
    </div>
    <div class="filter-row" id="site-filter"></div>

    <section>
      <p class="calendar-note">
        Click any tracked day for its full breakdown, photos and clips.
      </p>
      <div class="calendar-grid" id="calendar-grid"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
